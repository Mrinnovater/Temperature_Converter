<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovater's_mini_project</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f0f;
            color: #33FF00;
            font-family: 'VT323', monospace;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-top: 50px;
        }

        .container {
            margin-top: 50px;
            border: 2px solid #33FF00;
            padding: 20px;
            background-color: #1a1a1a;
            width: 400px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            background-color: #333;
            border: 2px solid #33FF00;
            color: #33FF00;
            font-size: 1.2em;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border-radius: 5px;
        }

        input:focus, button:focus {
            outline: none;
            border: 2px solid #FF00FF;
        }

        .output {
            color: #FF00FF;
            font-size: 1.5em;
        }

        .neon-text {
            color: #FF00FF;
            text-shadow: 1 1 2px #FF00FF, 1 5 5px #FF00FF, 1 2 7px #FF00FF;
        }

        .terminal {
            background-color: #000;
            color: #33FF00;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 1.2em;
            width: 100%;
            height: 50px;
        }

        .terminal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1 class="neon-text">Temperature Converter</h1>
    <div class="container">
        <div class="terminal-container">
            <input type="text" id="temperature" class="terminal" placeholder="Enter temperature value" />
            <select id="conversion-type" class="terminal">
                <option value="1">Celsius to Fahrenheit</option>
                <option value="2">Celsius to Kelvin</option>
                <option value="3">Fahrenheit to Celsius</option>
                <option value="4">Fahrenheit to Kelvin</option>
                <option value="5">Kelvin to Celsius</option>
                <option value="6">Kelvin to Fahrenheit</option>
            </select>
            <button onclick="convertTemperature()" class="terminal">Convert</button>
        </div>
        <p class="output" id="output"></p>
    </div>

    <script>
        function convertTemperature() {
            let temp = parseFloat(document.getElementById('temperature').value);
            let conversionType = document.getElementById('conversion-type').value;
            let result = '';

            if (!temp && temp !== 0) {
                result = "Invalid temperature value!";
            } else {
                switch (conversionType) {
                    case '1':
                        result = `${temp}°C = ${(temp * 9 / 5) + 32}°F`;
                        break;
                    case '2':
                        result = `${temp}°C = ${temp + 273.15}°K`;
                        break;
                    case '3':
                        result = `${temp}°F = ${(temp - 32) * 5 / 9}°C`;
                        break;
                    case '4':
                        result = `${temp}°F = ${(temp + 459.67) * 5 / 9}°K`;
                        break;
                    case '5':
                        result = `${temp}°K = ${temp - 273.15}°C`;
                        break;
                    case '6':
                        result = `${temp}°K = ${(temp * 9 / 5) - 459.67}°F`;
                        break;
                    default:
                        result = "Invalid option!";
                }
            }

            document.getElementById('output').textContent = result;
        }
    </script>
</body>
</html>
